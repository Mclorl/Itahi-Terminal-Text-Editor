name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [{cc: gcc, cxx: g++}, {cc: clang, cxx: clang++}]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.compiler.cc }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'patches/**') }}
      - name: Terminal emulator for the scenario tests
        run: pip install pyte
      - name: Configure
        run: cmake -S . -B build
        env: {CC: "${{ matrix.compiler.cc }}", CXX: "${{ matrix.compiler.cxx }}"}
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
